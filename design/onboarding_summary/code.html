<!DOCTYPE html><html class="light" lang="en"><head>

<style>

            font-family: 'Material Symbols Outlined';

            font-style: normal;

            letter-spacing: normal;

            word-wrap: normal;

            -webkit-font-smoothing: antialiased;
        }
        
        /* Donut Chart Animation & Styling */
        .chart-circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 1s ease-in-out;
        }
        
        /* Ambient Shadow for Card - Soft Depth */
        .shadow-soft {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.04);
        }

                        "tertiary": "#924628",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2c3130",
                        "background": "#f5faf8",
                        "on-surface": "#171d1c",
                        "tertiary-container": "#b05e3d",
                        "tertiary-fixed-dim": "#ffb59a",
                        "secondary": "#575e70",

<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased text-on-background">
<!-- Main Container: Centered Onboarding Card -->
<!-- Navigation is suppressed as per rules for linear onboarding flow -->
<main class="w-full max-w-md bg-surface rounded-2xl border border-surface-variant shadow-soft overflow-hidden flex flex-col">
<!-- Top Section: Progress & Header -->
<header class="p-lg pb-sm text-center flex flex-col items-center">
<!-- Progress Indicator 5/5 -->
<div class="flex items-center gap-xs mb-lg w-full max-w-[200px] mx-auto justify-center">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-primary rounded-full relative">
<!-- Glow effect for final step -->
<div class="absolute inset-0 bg-primary opacity-50 blur-sm rounded-full"></div>
</div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">
                Your Budget Overview
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Here is your calculated monthly plan based on the 50/30/20 rule.
            </p>
</header>
<!-- Content Section: Chart & Data -->
<section class="p-lg flex flex-col items-center gap-xl">
<!-- Donut Chart Visualization -->
<!-- Stroke width 12px as per guidelines. Circumference ≈ 502 for r=80 -->
<div class="relative w-48 h-48 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 200 200">
<!-- Background Track -->
<circle class="stroke-surface-container-highest" cx="100" cy="100" fill="none" r="80" stroke-width="12"></circle>
<!-- Needs (50% = 251 dash) -->
<circle class="stroke-primary chart-circle" cx="100" cy="100" fill="none" r="80" stroke-dasharray="251 502" stroke-dashoffset="0" stroke-linecap="round" stroke-width="12"></circle>
<!-- Wants (30% = 150 dash). Offset by Needs (251) -->
<circle class="stroke-secondary chart-circle" cx="100" cy="100" fill="none" r="80" stroke-dasharray="150 502" stroke-dashoffset="-251" stroke-linecap="round" stroke-width="12"></circle>
<!-- Savings (20% = 100 dash). Offset by Needs+Wants (401) -->
<circle class="stroke-tertiary chart-circle" cx="100" cy="100" fill="none" r="80" stroke-dasharray="100 502" stroke-dashoffset="-401" stroke-linecap="round" stroke-width="12"></circle>
</svg>
<!-- Center Text -->
<div class="absolute flex flex-col items-center justify-center text-center">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">Monthly</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">$4,500</span>
</div>
</div>
<!-- Summary Breakdown List -->
<div class="w-full flex flex-col gap-sm">
<!-- Needs Item -->
<div class="flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-3 h-3 rounded-full bg-primary ring-4 ring-primary/10 group-hover:ring-primary/20 transition-all"></div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Fixed Needs</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">50% of income</span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">$2,250</span>
</div>
<!-- Wants Item -->
<div class="flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-3 h-3 rounded-full bg-secondary ring-4 ring-secondary/10 group-hover:ring-secondary/20 transition-all"></div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Variable Wants</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">30% of income</span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">$1,350</span>
</div>
<!-- Savings Item -->
<div class="flex items-center justify-between p-md rounded-xl bg-surface-container-lowest border border-surface-variant hover:bg-surface-container-low transition-colors group">
<div class="flex items-center gap-md">
<div class="w-3 h-3 rounded-full bg-tertiary ring-4 ring-tertiary/10 group-hover:ring-tertiary/20 transition-all"></div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Future Savings</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">20% of income</span>
</div>
</div>
<span class="font-body-md text-body-md text-on-surface font-medium">$900</span>
</div>
</div>
</section>
<!-- Bottom Action -->
<footer class="p-lg pt-sm mt-auto">
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md h-12 rounded-xl flex items-center justify-center gap-sm transition-all shadow-[0_4px_12px_rgba(0,104,95,0.2)] hover:shadow-[0_6px_16px_rgba(0,104,95,0.3)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]">
<span>Confirm &amp; Finish</span>
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</button>
<button class="w-full mt-sm text-primary font-label-sm text-label-sm h-10 rounded-xl hover:bg-surface-variant/30 transition-colors">
                Edit Allocation
            </button>
</footer>
</main>
<script>
        // Simple animation trigger for the chart on load to give a premium feel
        document.addEventListener('DOMContentLoaded', () => {
            const circles = document.querySelectorAll('.chart-circle');
            
            // Temporarily hide offsets to animate them in
            circles.forEach(circle => {
                const finalOffset = circle.getAttribute('stroke-dashoffset');
                circle.style.strokeDashoffset = '502'; // full circumference
                
                // Trigger reflow
                void circle.offsetWidth;
                
                // Set to final offset
                setTimeout(() => {
                    circle.style.strokeDashoffset = finalOffset;
                }, 100);
            });
        });
    </script>
</body></html>
