<style>
        .slide-up {
            animation: slideUp 0.3s ease-out forwards;
        }

            from { transform: translateY(100%); }
            to { transform: translateY(0); }

      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-lg overflow-hidden h-screen flex flex-col">
<!-- Faux Background Content (Dashboard) -->
<div class="flex-1 opacity-40 blur-sm pointer-events-none p-margin-mobile flex flex-col gap-lg">
<header class="flex justify-between items-center w-full h-16 bg-surface dark:bg-inverse-surface text-primary dark:text-primary-fixed-dim font-headline-md text-headline-md">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="font-bold">Flousy</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</header>
<div class="h-32 bg-surface-container rounded-2xl p-lg flex flex-col justify-center shadow-sm border border-surface-variant">
<div class="font-body-md text-on-surface-variant">Total Balance</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">$2,450.00</div>
</div>
<div class="grid grid-cols-2 gap-gutter">
<div class="h-24 bg-surface-container rounded-2xl p-md shadow-sm border border-surface-variant"></div>
<div class="h-24 bg-surface-container rounded-2xl p-md shadow-sm border border-surface-variant"></div>
</div>
</div>
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-surface/60 backdrop-blur-[8px] z-40 flex items-end sm:items-center justify-center transition-opacity">
<!-- Modal Container (Sliding from bottom on mobile, centered on desktop) -->
<div class="w-full sm:w-[480px] bg-surface rounded-t-3xl sm:rounded-2xl shadow-[0_10px_40px_-10px_rgba(0,0,0,0.12)] border border-surface-variant z-50 flex flex-col slide-up h-[751px] sm:h-auto max-h-[795px]">
<!-- Handle for mobile -->
<div class="w-full flex justify-center pt-md pb-xs sm:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Modal Header -->
<div class="px-lg pt-sm sm:pt-lg pb-md flex justify-between items-center border-b border-surface-variant">
<h2 class="font-headline-md text-headline-md text-on-surface">Add Expense</h2>
<button class="p-2 text-on-surface-variant hover:bg-surface-variant/50 rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Modal Content (Scrollable) -->
<div class="flex-1 overflow-y-auto px-lg py-lg flex flex-col gap-xl">
<!-- Amount Input -->
<div class="flex flex-col items-center justify-center py-sm">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Amount</label>
<div class="flex items-center text-primary font-bold">
<span class="text-headline-lg-mobile mr-xs">$</span>
<input autofocus="" class="bg-transparent border-none text-[48px] leading-[1.1] text-center w-full max-w-[200px] text-on-surface focus:ring-0 p-0 placeholder:text-outline-variant" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Fields Grid -->
<div class="flex flex-col gap-lg">
<!-- Category Selection -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">CATEGORY</label>
<button class="flex items-center justify-between w-full p-md bg-surface border border-outline-variant rounded-xl hover:border-primary focus:border-primary focus:ring-1 focus:ring-primary transition-all text-left group">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">category</span>
</div>
<span class="font-body-lg text-body-lg text-on-surface">Select Category</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">chevron_right</span>
</button>
</div>
<!-- Money Place / Account -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">MONEY PLACE</label>
<div class="grid grid-cols-3 gap-sm">
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="account" type="radio" value="bank"/>
<div class="flex flex-col items-center gap-2 p-md rounded-xl border border-outline-variant peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-surface-variant/30 transition-all">
<span class="material-symbols-outlined text-outline peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">account_balance</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary">Bank</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="account" type="radio" value="wallet"/>
<div class="flex flex-col items-center gap-2 p-md rounded-xl border border-outline-variant peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-surface-variant/30 transition-all">
<span class="material-symbols-outlined text-outline peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">account_balance_wallet</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary">Wallet</span>
</div>
</label>
<label class="cursor-pointer relative">
<input class="peer sr-only" name="account" type="radio" value="home"/>
<div class="flex flex-col items-center gap-2 p-md rounded-xl border border-outline-variant peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-surface-variant/30 transition-all">
<span class="material-symbols-outlined text-outline peer-checked:text-primary" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-md text-label-md text-on-surface peer-checked:text-primary">Home</span>
</div>
</label>
</div>
</div>
<!-- Date & Time -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">DATE</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
</div>
<input class="w-full pl-12 pr-md py-md bg-surface border border-outline-variant rounded-xl font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all" type="date"/>
</div>
</div>
<!-- Note -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant">NOTE (OPTIONAL)</label>
<textarea class="w-full p-md bg-surface border border-outline-variant rounded-xl font-body-lg text-body-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" placeholder="What was this for?" rows="2"></textarea>
</div>
</div>
</div>
<!-- Modal Footer (Fixed at bottom) -->
<div class="p-lg border-t border-surface-variant bg-surface rounded-b-xl pb-margin-mobile sm:pb-lg">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-4 rounded-xl hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm hover:shadow-md transition-all active:scale-[0.98]">
                    Add Expense
                </button>
</div>
</div>
</div>
