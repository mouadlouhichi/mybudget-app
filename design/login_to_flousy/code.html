<!DOCTYPE html><html lang="en"><head>

<style>
        /* Base styles enforcing the fluid grid and background */
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom soft shadow for cards (Level 1 Elevation) */
        .shadow-soft {
            box-shadow: 0 4px 24px -4px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02);
        }
        
        /* Material symbols setup */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="min-h-screen flex flex-col font-sans">
<!-- Top Banner for Email Verification -->
<div class="w-full bg-tertiary-container text-on-tertiary-container px-margin-mobile py-sm flex items-center justify-between" role="alert">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-[20px]">mark_email_unread</span>
<span class="font-body-md text-body-md">Please verify your email address to unlock all features.</span>
</div>
<button aria-label="Dismiss banner" class="text-on-tertiary-container hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Main Content Area (Nav suppressed due to transactional nature of Login) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Login Card / Container -->
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-[24px] border border-outline-variant shadow-soft p-lg md:p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="flex flex-col items-center gap-xs mb-sm">
<!-- Wordmark as requested -->
<h1 class="font-headline-lg text-headline-lg md:font-headline-lg text-primary tracking-tight font-extrabold">Flousy</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back to your financial center</p>
</div>
<!-- Inline Error State (Simulated Fallback) -->
<div class="w-full bg-error-container/30 border border-error-container rounded-lg p-md flex items-start gap-sm">
<span class="material-symbols-outlined text-error text-[20px] mt-[2px]">error</span>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-error font-semibold">Connection Error</span>
<span class="font-body-md text-body-md text-on-error-container">Firebase isn't configured. Please contact support if this persists.</span>
</div>
</div>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg pl-10 pr-md py-[12px] font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Primary Action -->
<button class="w-full mt-sm bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-xl hover:bg-surface-tint transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                    Log in
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-xs">
<div class="h-px bg-outline-variant flex-grow"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="h-px bg-outline-variant flex-grow"></div>
</div>
<!-- Secondary Action -->
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-label-md text-label-md py-[14px] rounded-xl flex items-center justify-center gap-sm hover:bg-surface transition-colors focus:outline-none focus:ring-2 focus:ring-outline-variant focus:ring-offset-2" type="button">
<!-- Using a generic public domain SVG for Google as requested by constraints to avoid external image dependencies unless specified, but prompt says "with icon", so I will use a simple SVG structure representing the 'G' roughly, or fallback to text if strict. Actually, standard practice in these isolated environments is a raw SVG or placeholder. I will use a simple raw SVG for the Google icon to ensure it renders without external requests. -->
<svg height="20px" viewBox="0 0 48 48" width="20px" xmlns="http://www.w3.org/2000/svg">
<path d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" fill="#EA4335"></path>
<path d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" fill="#4285F4"></path>
<path d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" fill="#FBBC05"></path>
<path d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" fill="#34A853"></path>
</svg>
                Continue with Google
            </button>
<!-- Footer Link -->
<div class="text-center mt-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Don't have an account? </span>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Create account</a>
</div>
</div>
</main>
</body></html>
