<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Flousy - Onboarding Step 2</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#008378",
                        "surface-variant": "#dee4e1",
                        "surface-container-high": "#e4e9e7",
                        "primary-fixed-dim": "#6bd8cb",
                        "outline-variant": "#bcc9c6",
                        "surface": "#f5faf8",
                        "on-tertiary-fixed-variant": "#773215",
                        "tertiary-fixed": "#ffdbce",
                        "on-secondary-container": "#5c6274",
                        "primary-fixed": "#89f5e7",
                        "on-primary-fixed": "#00201d",
                        "outline": "#6d7a77",
                        "on-surface-variant": "#3d4947",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#404758",
                        "on-tertiary-container": "#fffbff",
                        "on-error": "#ffffff",
                        "surface-bright": "#f5faf8",
                        "secondary-fixed": "#dce2f7",
                        "secondary-container": "#d9dff5",
                        "inverse-primary": "#6bd8cb",
                        "on-secondary-fixed": "#141b2b",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "tertiary": "#924628",
                        "surface-container-lowest": "#ffffff",
                        "inverse-surface": "#2c3130",
                        "background": "#f5faf8",
                        "on-surface": "#171d1c",
                        "tertiary-container": "#b05e3d",
                        "tertiary-fixed-dim": "#ffb59a",
                        "secondary": "#575e70",
                        "surface-container-highest": "#dee4e1",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d6dbd9",
                        "primary": "#00685f",
                        "on-tertiary-fixed": "#370e00",
                        "error-container": "#ffdad6",
                        "secondary-fixed-dim": "#c0c6db",
                        "on-primary": "#ffffff",
                        "on-background": "#171d1c",
                        "surface-tint": "#006a61",
                        "surface-container-low": "#f0f5f2",
                        "on-primary-container": "#f4fffc",
                        "surface-container": "#eaefed",
                        "on-primary-fixed-variant": "#005049",
                        "inverse-on-surface": "#edf2f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "margin-mobile": "16px",
                        "sm": "8px",
                        "base": "4px",
                        "gutter": "16px",
                        "xs": "4px",
                        "lg": "24px",
                        "xl": "32px",
                        "margin-desktop": "48px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]

                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center">
<!-- Top Navigation (Onboarding - Suppressed Navigation Shell) -->
<header class="w-full flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 max-w-4xl mx-auto">
<div class="flex items-center gap-sm">
<button aria-label="Go Back" class="text-on-surface-variant hover:opacity-80 transition-opacity p-sm rounded-full bg-surface-container-low">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">
            Flousy
        </div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-2xl px-margin-mobile md:px-margin-desktop py-xl flex-grow flex flex-col">
<!-- Progress Indicator -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Step 2 of 5</span>
<span class="font-label-md text-label-md text-primary">Budget Categories</span>
</div>
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full rounded-full w-2/5 transition-all duration-500 ease-in-out"></div>
</div>
</div>
<!-- Header -->
<div class="mb-xl text-center md:text-left">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-sm">
                Select your budget categories
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Choose the main areas where you spend your money to tailor your dashboard.
            </p>
</div>
<!-- Categories Grid -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-md mb-xl flex-grow content-start">
<!-- Category Chip: Food -->
<button class="group flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low hover:border-primary hover:bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#f97316]"></div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">restaurant</span>
<span class="font-label-md text-label-md text-on-surface">Food</span>
</div>
</button>
<!-- Category Chip: Transport -->
<button class="group flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low hover:border-primary hover:bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#3b82f6]"></div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">directions_car</span>
<span class="font-label-md text-label-md text-on-surface">Transport</span>
</div>
</button>
<!-- Category Chip: Rent -->
<button class="group flex items-center justify-between p-md rounded-xl border-2 border-primary bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#8b5cf6]"></div>
<span class="material-symbols-outlined text-primary">home</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Rent</span>
</div>
<span class="material-symbols-outlined text-primary text-sm">check_circle</span>
</button>
<!-- Category Chip: Entertainment -->
<button class="group flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low hover:border-primary hover:bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#ec4899]"></div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">sports_esports</span>
<span class="font-label-md text-label-md text-on-surface">Entertainment</span>
</div>
</button>
<!-- Category Chip: Health -->
<button class="group flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low hover:border-primary hover:bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#10b981]"></div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">favorite</span>
<span class="font-label-md text-label-md text-on-surface">Health</span>
</div>
</button>
<!-- Category Chip: Utilities -->
<button class="group flex items-center justify-between p-md rounded-xl border-2 border-primary bg-primary-container/10 transition-colors duration-200 text-left focus:outline-none focus:ring-2 focus:ring-primary">
<div class="flex items-center gap-sm">
<div class="w-3 h-3 rounded-full bg-[#eab308]"></div>
<span class="material-symbols-outlined text-primary">bolt</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Utilities</span>
</div>
<span class="material-symbols-outlined text-primary text-sm">check_circle</span>
</button>
</div>
<!-- Add Custom Category Action -->
<div class="flex justify-center md:justify-start mb-xl">
<button class="flex items-center gap-sm text-primary hover:opacity-80 transition-opacity font-label-md text-label-md focus:outline-none focus:ring-2 focus:ring-primary rounded-lg p-sm">
<span class="material-symbols-outlined">add</span>
                Add Custom Category
            </button>
</div>
<!-- Footer Actions -->
<div class="mt-auto flex flex-col md:flex-row-reverse gap-md justify-between items-center pb-xl pt-md border-t border-surface-variant">
<button class="w-full md:w-auto bg-primary text-on-primary hover:opacity-90 font-label-md text-label-md py-3 px-8 rounded-full shadow-[0_4px_14px_0_rgba(0,104,95,0.12)] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Continue
            </button>
<button class="w-full md:w-auto text-on-surface-variant hover:text-on-surface font-label-md text-label-md py-3 px-8 rounded-full transition-colors focus:outline-none">
                Skip for now
            </button>
</div>
</main>
</body></html>
