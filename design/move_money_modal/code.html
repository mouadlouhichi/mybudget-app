<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Flousy - Transfer Money</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#6bd8cb",
                        "tertiary-fixed": "#ffdbce",
                        "on-tertiary-fixed-variant": "#773215",
                        "surface-container-high": "#e4e9e7",
                        "on-primary-container": "#f4fffc",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#5c6274",
                        "primary-fixed": "#89f5e7",
                        "on-surface-variant": "#3d4947",
                        "primary-container": "#008378",
                        "outline": "#6d7a77",
                        "tertiary-container": "#b05e3d",
                        "secondary-container": "#d9dff5",
                        "on-primary-fixed-variant": "#005049",
                        "error-container": "#ffdad6",
                        "surface": "#f5faf8",
                        "surface-bright": "#f5faf8",
                        "surface-tint": "#006a61",
                        "inverse-on-surface": "#edf2f0",
                        "on-tertiary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#d6dbd9",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#2c3130",
                        "tertiary-fixed-dim": "#ffb59a",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#bcc9c6",
                        "surface-variant": "#dee4e1",
                        "on-primary-fixed": "#00201d",
                        "secondary-fixed": "#dce2f7",
                        "secondary-fixed-dim": "#c0c6db",
                        "error": "#ba1a1a",
                        "secondary": "#575e70",
                        "primary-fixed-dim": "#6bd8cb",
                        "surface-container-low": "#f0f5f2",
                        "on-tertiary-container": "#fffbff",
                        "tertiary": "#924628",
                        "surface-container-highest": "#dee4e1",
                        "background": "#f5faf8",
                        "primary": "#00685f",
                        "on-tertiary-fixed": "#370e00",
                        "on-secondary-fixed": "#141b2b",
                        "surface-container": "#eaefed",
                        "on-secondary-fixed-variant": "#404758",
                        "on-background": "#171d1c",
                        "on-surface": "#171d1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "48px",
                        "sm": "8px",
                        "md": "16px",
                        "gutter": "16px",
                        "xs": "4px",
                        "xl": "32px",
                        "base": "4px",
                        "margin-mobile": "16px",
                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.03em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .modal-backdrop {
            backdrop-filter: blur(8px);
            background-color: rgba(245, 250, 248, 0.6); /* surface with 60% opacity */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4">
<!-- Modal Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-margin-mobile md:p-margin-desktop">
<!-- Modal Content (Level 2 Elevation) -->
<div class="w-full max-w-md bg-surface rounded-2xl shadow-[0_12px_24px_rgba(0,0,0,0.12)] border border-outline-variant overflow-hidden flex flex-col">
<!-- Header -->
<div class="px-lg pt-lg pb-md flex justify-between items-center border-b border-surface-variant">
<h2 class="font-headline-md text-headline-md text-on-surface">Move Money</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- From / To Selectors -->
<div class="flex flex-col gap-sm relative">
<!-- From -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">From</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-lg py-3 px-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer">
<option>Main Checking (...1234)</option>
<option>Savings Account (...5678)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Swap Icon (Decorative) -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 bg-surface rounded-full p-1 border border-outline-variant shadow-sm text-primary">
<span class="material-symbols-outlined text-[20px]">swap_vert</span>
</div>
<!-- To -->
<div class="flex flex-col gap-xs mt-2">
<label class="font-label-md text-label-md text-on-surface-variant">To</label>
<div class="relative">
<select class="w-full appearance-none bg-surface border border-outline-variant rounded-lg py-3 px-4 font-body-lg text-body-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary cursor-pointer">
<option>Vacation Fund (...9012)</option>
<option>Emergency Savings</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Amount Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 font-headline-lg text-headline-lg text-on-surface-variant">$</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-4 pl-12 pr-4 font-headline-lg text-headline-lg text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-center tracking-tight" placeholder="0.00" type="number"/>
</div>
</div>
<!-- Preview Section -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant flex flex-col gap-sm">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Estimated Balances</h3>
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[16px]">account_balance</span>
<span class="font-body-md text-body-md text-on-surface">Main Checking</span>
</div>
<div class="text-right">
<span class="font-body-md text-body-md text-on-surface line-through opacity-60 mr-2">$4,250.00</span>
<span class="font-headline-md text-headline-md text-on-surface">$4,000.00</span>
</div>
</div>
<div class="h-px w-full bg-outline-variant/50 my-1"></div>
<div class="flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[16px]">wallet</span>
<span class="font-body-md text-body-md text-on-surface">Vacation Fund</span>
</div>
<div class="text-right">
<span class="font-body-md text-body-md text-on-surface line-through opacity-60 mr-2">$1,200.00</span>
<span class="font-headline-md text-headline-md text-primary">$1,450.00</span>
</div>
</div>
</div>
</div>
<!-- Footer / Actions -->
<div class="p-lg pt-0 flex gap-md">
<button class="flex-1 py-3 px-4 rounded-lg font-label-md text-label-md border border-outline text-on-surface hover:bg-surface-variant/50 transition-colors">
                    Cancel
                </button>
<button class="flex-[2] py-3 px-4 rounded-lg font-label-md text-label-md bg-primary text-on-primary hover:opacity-90 transition-opacity flex items-center justify-center gap-2 shadow-sm">
<span>Confirm Transfer</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
